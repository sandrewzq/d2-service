appId: local.d2-tools.desktop
productName: d2-tools
icon: build/icon.ico
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - "dist/**/*.js"
  - "dist/**/*.cjs"
  - "dist/**/*.mjs"
  - "dist/renderer/**"
  - "package.json"
extraResources:
  - from: "build/LICENSE.txt"
    to: "LICENSE.txt"
  - from: "build/THIRD_PARTY_NOTICES.txt"
    to: "THIRD_PARTY_NOTICES.txt"
asar: true
compression: maximum
publish:
  provider: github
  owner: sandrewzq
  repo: d2-tools
win:
  # Signing is optional. Unsigned Windows packages remain supported so the
  # updater can download them and ask the user to restart and install.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
artifactName: "d2-tools-setup-${version}.${ext}"
nsis:
  oneClick: false
  license: build/LICENSE.txt
  allowToChangeInstallationDirectory: true
  shortcutName: "d2-tools"
  uninstallDisplayName: "d2-tools"
  include: build/installer.nsh
